<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="SignalAtlas: abstract map of clustered market opportunity signals">
  <defs>
    <linearGradient id="sa-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6efe4"/>
      <stop offset="1" stop-color="#ecd9c5"/>
    </linearGradient>
    <radialGradient id="sa-glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#b3543a" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#b3543a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="500" fill="url(#sa-bg)"/>
  <rect width="800" height="500" fill="url(#sa-glow)"/>

  <!-- dotted "map" field -->
  <g fill="#d8bfa3" opacity="0.55">
    <circle cx="90" cy="120" r="4"/><circle cx="210" cy="70" r="3"/><circle cx="330" cy="140" r="4"/>
    <circle cx="120" cy="290" r="3"/><circle cx="60" cy="410" r="4"/><circle cx="250" cy="380" r="3"/>
    <circle cx="700" cy="100" r="3"/><circle cx="620" cy="180" r="4"/><circle cx="740" cy="280" r="3"/>
    <circle cx="690" cy="420" r="4"/><circle cx="560" cy="450" r="3"/><circle cx="480" cy="120" r="3"/>
    <circle cx="430" cy="430" r="3"/><circle cx="150" cy="200" r="3"/><circle cx="640" cy="320" r="3"/>
  </g>

  <!-- radar rings -->
  <g fill="none" stroke="#b3543a" stroke-opacity="0.28" stroke-width="2">
    <circle cx="400" cy="210" r="150"/>
    <circle cx="400" cy="210" r="105"/>
    <circle cx="400" cy="210" r="60"/>
  </g>
  <line x1="250" y1="210" x2="550" y2="210" stroke="#b3543a" stroke-opacity="0.2" stroke-width="1.5"/>
  <line x1="400" y1="60" x2="400" y2="360" stroke="#b3543a" stroke-opacity="0.2" stroke-width="1.5"/>

  <!-- cluster dots -->
  <g fill="#c98a5e" opacity="0.85">
    <circle cx="330" cy="160" r="9"/>
    <circle cx="470" cy="150" r="7"/>
    <circle cx="330" cy="260" r="11"/>
    <circle cx="480" cy="270" r="8"/>
    <circle cx="430" cy="205" r="6"/>
  </g>

  <!-- center opportunity pin -->
  <g>
    <circle cx="400" cy="210" r="16" fill="#fff"/>
    <circle cx="400" cy="210" r="10" fill="#b3543a"/>
    <circle cx="400" cy="210" r="4" fill="#fff"/>
  </g>

  <!-- floating "signal" card -->
  <g transform="translate(56 64)">
    <rect width="168" height="54" rx="12" fill="#ffffff" fill-opacity="0.9"/>
    <rect x="14" y="13" width="7" height="7" rx="3.5" fill="#b3543a"/>
    <text x="30" y="20" font-family="ui-monospace, monospace" font-size="12" fill="#5b4f43" font-weight="600">+23 signals</text>
    <text x="14" y="40" font-family="ui-monospace, monospace" font-size="10" fill="#8a7563">opportunity cluster</text>
  </g>

  <!-- floating "score" card -->
  <g transform="translate(576 348)">
    <rect width="168" height="54" rx="12" fill="#ffffff" fill-opacity="0.9"/>
    <text x="14" y="22" font-family="ui-monospace, monospace" font-size="12" fill="#5b4f43" font-weight="600">score 87/100</text>
    <text x="14" y="42" font-family="ui-monospace, monospace" font-size="10" fill="#8a7563">market opportunity</text>
  </g>

  <!-- bottom label -->
  <text x="400" y="476" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" letter-spacing="4" fill="#9a4527" font-weight="700">SIGNALATLAS</text>
</svg>
