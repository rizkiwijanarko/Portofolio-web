<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="VentureForge: abstract multi-agent graph of startup discovery">
  <defs>
    <linearGradient id="vf-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6efe4"/>
      <stop offset="1" stop-color="#ecd9c5"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#vf-bg)"/>

  <!-- edges -->
  <g stroke="#b3543a" stroke-opacity="0.3" stroke-width="2" fill="none">
    <path d="M150 120 C 230 160, 270 200, 330 220"/>
    <path d="M150 120 C 220 90, 280 90, 340 120"/>
    <path d="M330 220 C 380 260, 420 260, 470 220"/>
    <path d="M340 120 C 390 90, 440 90, 490 130"/>
    <path d="M470 220 C 530 260, 570 260, 620 220"/>
    <path d="M490 130 C 550 90, 590 90, 640 130"/>
    <path d="M340 120 C 380 190, 400 240, 470 220"/>
    <path d="M490 130 C 520 180, 540 220, 620 220"/>
  </g>

  <!-- source nodes -->
  <g>
    <circle cx="150" cy="120" r="22" fill="#ffffff" fill-opacity="0.95"/>
    <circle cx="150" cy="120" r="12" fill="#b3543a"/>
  </g>
  <!-- mid nodes -->
  <g fill="#ffffff" fill-opacity="0.95">
    <circle cx="335" cy="170" r="20"/>
    <circle cx="480" cy="175" r="20"/>
  </g>
  <!-- output node -->
  <g>
    <circle cx="630" cy="175" r="26" fill="#b3543a"/>
    <path d="M622 175 l6 6 12 -12" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- node glyphs -->
  <g fill="#b3543a" opacity="0.85">
    <circle cx="130" cy="105" r="3"/><circle cx="170" cy="110" r="3"/><circle cx="140" cy="138" r="3"/><circle cx="166" cy="132" r="3"/>
  </g>
  <g fill="#b3543a" opacity="0.7">
    <circle cx="335" cy="162" r="3.5"/><circle cx="335" cy="178" r="3.5"/>
    <circle cx="480" cy="167" r="3.5"/><circle cx="480" cy="183" r="3.5"/>
  </g>

  <!-- labels -->
  <text x="150" y="170" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#8a7563" font-weight="600">HACKER NEWS</text>
  <text x="335" y="214" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#8a7563" font-weight="600">SCORING AGENT</text>
  <text x="480" y="219" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#8a7563" font-weight="600">RANKER</text>
  <text x="630" y="228" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#8a7563" font-weight="600">TOP IDEAS</text>

  <!-- decorative ring -->
  <circle cx="630" cy="175" r="42" fill="none" stroke="#b3543a" stroke-opacity="0.18" stroke-width="1.5"/>

  <text x="400" y="476" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" letter-spacing="4" fill="#9a4527" font-weight="700">VENTUREFORGE</text>
</svg>
