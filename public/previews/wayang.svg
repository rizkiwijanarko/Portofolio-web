<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Wayang: stylized wayang kulit puppet silhouette with batik pattern">
  <defs>
    <linearGradient id="wy-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6efe4"/>
      <stop offset="1" stop-color="#ecd9c5"/>
    </linearGradient>
    <pattern id="wy-batik" x="0" y="0" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M22 6 q6 8 0 16 q-6 -8 0 -16" fill="none" stroke="#c98a5e" stroke-opacity="0.5" stroke-width="1.5"/>
      <circle cx="22" cy="22" r="2" fill="#c98a5e" fill-opacity="0.5"/>
      <path d="M0 38 q6 8 0 16 q-6 -8 0 -16" fill="none" stroke="#c98a5e" stroke-opacity="0.5" stroke-width="1.5"/>
      <path d="M44 38 q6 8 0 16 q-6 -8 0 -16" fill="none" stroke="#c98a5e" stroke-opacity="0.5" stroke-width="1.5"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#wy-bg)"/>
  <rect width="800" height="500" fill="url(#wy-batik)"/>

  <!-- puppet silhouette (wayang kulit profile head with ornate crown) -->
  <g transform="translate(400 268)">
    <path d="
      M -8 -150
      C -40 -128, -52 -96, -50 -70
      L -86 -76 C -96 -72, -96 -58, -84 -54 L -52 -52
      C -56 -20, -44 8, -20 30
      C -40 44, -52 62, -52 86
      C -52 108, -38 120, -20 126
      L -20 150
      L 4 150
      L 4 128
      C 26 118, 36 96, 34 74
      C 32 56, 24 42, 12 34
      C 30 14, 38 -12, 36 -38
      C 34 -70, 18 -94, -2 -112
      C -2 -124, -2 -138, -8 -150
      Z
    " fill="#b3543a"/>
    <!-- crown ornament -->
    <path d="M -8 -150 C 6 -168, 22 -160, 30 -142 C 34 -130, 30 -120, 20 -114 L 12 -128 L 4 -118 L -4 -132 L -12 -122 L -16 -136 Z" fill="#9a4527"/>
    <!-- eye -->
    <circle cx="2" cy="-64" r="6" fill="#fff"/>
    <circle cx="4" cy="-64" r="3" fill="#2b2118"/>
    <!-- mouth -->
    <path d="M -12 2 C -6 10, 4 10, 10 4" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- neck ornament -->
    <rect x="-14" y="128" width="36" height="6" rx="3" fill="#9a4527"/>
    <rect x="-20" y="140" width="48" height="6" rx="3" fill="#9a4527"/>
  </g>

  <!-- classification chips -->
  <g font-family="ui-monospace, monospace" font-size="11" font-weight="700">
    <g transform="translate(120 120)">
      <rect width="150" height="34" rx="17" fill="#ffffff" fill-opacity="0.92"/>
      <text x="75" y="22" text-anchor="middle" fill="#9a4527" letter-spacing="1">99.8% ACCURACY</text>
    </g>
    <g transform="translate(540 340)">
      <rect width="160" height="34" rx="17" fill="#ffffff" fill-opacity="0.92"/>
      <text x="80" y="22" text-anchor="middle" fill="#9a4527" letter-spacing="1">22 WAYANG CLASSES</text>
    </g>
  </g>

  <text x="400" y="476" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" letter-spacing="4" fill="#9a4527" font-weight="700">WAYANG</text>
</svg>
