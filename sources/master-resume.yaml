design:
  theme: engineeringresumes
  page:
    size: us-letter
    top_margin: 0.65in
    bottom_margin: 0.65in
    left_margin: 0.6in
    right_margin: 0.6in
    show_footer: false
    show_top_note: false
  colors:
    name: rgb(0, 0, 0)
    connections: rgb(0, 0, 0)
    headline: rgb(0, 0, 0)
    section_titles: rgb(0, 0, 0)
    links: rgb(0, 79, 144)
  typography:
    line_spacing: 0.6em
    alignment: justified
    date_and_location_column_alignment: right
    font_family:
      body: XCharter
      name: XCharter
      headline: XCharter
      connections: XCharter
      section_titles: XCharter
    font_size:
      body: 10pt
      name: 26pt
      headline: 10pt
      connections: 10pt
      section_titles: 1.2em
    bold:
      name: false
      headline: false
      connections: false
      section_titles: true
  links:
    underline: false
    show_external_link_icon: false
  header:
    alignment: center
    space_below_name: 0.25cm
    space_below_headline: 0.25cm
    space_below_connections: 0.25cm
    connections:
      phone_number_format: international
      hyperlink: true
      show_icons: false
      display_urls_instead_of_usernames: true
      separator: ' | '
      space_between_connections: 0.35cm
  section_titles:
    type: with_full_line
    line_thickness: 0.5pt
    space_above: 0.5cm
    space_below: 0.3cm
  sections:
    allow_page_break: true
    space_between_regular_entries: 0.42cm
    space_between_text_based_entries: 0.15cm
    show_time_spans_in: []
  entries:
    date_and_location_width: 3.5cm
    side_space: 0cm
    space_between_columns: 0.15cm
    allow_page_break: true
    short_second_row: false
    degree_width: 1cm
    summary:
      space_above: 0.08cm
      space_left: 0cm
    highlights:
      bullet: ●
      nested_bullet: ●
      space_left: 0cm
      space_above: 0.08cm
      space_between_items: 0.08cm
      space_between_bullet_and_text: 0.4em

